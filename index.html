<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ethiopian Calorie & Fitness Planner</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f2f5f7;
    margin: 0;
    padding: 0;
    color: #222;
}

header {
    background: #1f4e5f;
    color: white;
    text-align: center;
    padding: 22px 10px;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

header p {
    margin: 8px 0 0;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    margin: 18px 0;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.card h2 {
    color: #1f4e5f;
    margin-top: 0;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    border: none;
    border-radius: 7px;
    background: #1f4e5f;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.result {
    margin-top: 18px;
    padding: 15px;
    background: #eef7f8;
    border-radius: 8px;
    line-height: 1.6;
}

.exercise {
    background: #f8f8f8;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
}

.warning {
    background: #fff4d6;
    padding: 12px;
    border-radius: 7px;
    margin-top: 12px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #666;
}

</style>
</head>

<body>

<header>

<h1>Ethiopian Calorie & Fitness Planner</h1>

<p>Body Composition • Nutrition • Calories • Training Programs</p>

</header>


<div class="container">


<!-- ================= BODY COMPOSITION ================= -->

<div class="card">

<h2>⚖️ Body Composition & BMI</h2>

<label>Weight (kg)</label>

<input
type="number"
id="weight"
placeholder="Enter weight in kg"
step="0.1"
>


<label>Height (cm)</label>

<input
type="number"
id="height"
placeholder="Enter height in cm"
step="0.1"
>


<button onclick="calculateBMI()">
Calculate Body Composition
</button>


<div id="bmiResult" class="result"></div>

</div>



<!-- ================= DAILY CALORIE REQUIREMENTS ================= -->

<div class="card">

<h2>🔥 Daily Calorie Requirements</h2>


<label>Goal</label>

<select id="goal">

<option value="">
-- Select Goal --
</option>

<option value="weightloss">
Weight Loss
</option>

<option value="maintenance">
Weight Maintenance
</option>

<option value="muscle">
Muscle Gain
</option>

<option value="strength">
Strength & Performance
</option>

</select>


<label>Current Fitness Level</label>

<select id="level">

<option value="">
-- Select Level --
</option>

<option value="beginner">
Beginner
</option>

<option value="intermediate">
Intermediate
</option>

<option value="advanced">
Advanced
</option>

</select>


<label>Training Type</label>

<select id="type">

<option value="">
-- Select Training Type --
</option>

<option value="strength">
Strength
</option>

<option value="aerobic">
Aerobic
</option>

<option value="core">
Core
</option>

<option value="strength-aerobic">
Strength + Aerobic
</option>

<option value="strength-core">
Strength + Core
</option>

<option value="aerobic-core">
Aerobic + Core
</option>

</select>


<label>Training Days Per Week</label>

<select id="days">

<option value="3">3 Days</option>
<option value="4">4 Days</option>
<option value="5">5 Days</option>
<option value="6">6 Days</option>

</select>


<button onclick="createProgram()">
Calculate Daily Requirements
</button>


<div id="programResult" class="result"></div>

</div>



<!-- ================= TRAINING PROGRAM ================= -->

<div class="card">

<h2>🏋️ Training Program</h2>


<label>Training Goal</label>

<select id="trainingGoal">

<option value="">
-- Select Goal --
</option>

<option value="strength">
Strength
</option>

<option value="muscle">
Muscle Building
</option>

<option value="fitness">
General Fitness
</option>

<option value="weightloss">
Weight Management
</option>

<option value="performance">
Sport Performance
</option>

</select>


<label>Current Level</label>

<select id="trainingLevel">

<option value="">
-- Select Level --
</option>

<option value="beginner">
Beginner
</option>

<option value="intermediate">
Intermediate
</option>

<option value="advanced">
Advanced
</option>

</select>


<label>Training Type</label>

<select id="trainingType">

<option value="">
-- Select Training Type --
</option>

<option value="strength">
Strength
</option>

<option value="aerobic">
Aerobic
</option>

<option value="core">
Core
</option>

<option value="strength-aerobic">
Strength + Aerobic
</option>

<option value="strength-core">
Strength + Core
</option>

<option value="aerobic-core">
Aerobic + Core
</option>

</select>


<label>Training Days Per Week</label>

<select id="trainingDays">

<option value="3">3 Days</option>
<option value="4">4 Days</option>
<option value="5">5 Days</option>
<option value="6">6 Days</option>

</select>


<button onclick="createAdvancedProgram()">
Create Training Program
</button>


<div id="advancedProgramResult" class="result"></div>

</div>



<!-- ================= FOOD DATABASE ================= -->

<div class="card">

<h2>🍽️ Ethiopian Food Nutrition Database</h2>


<label>Select Food</label>

<select id="foodSelect">

<option value="">
-- Select Ethiopian Food --
</option>

<option value="injera">Injera</option>

<option value="misir">Misir Wot</option>

<option value="shiro">Shiro Wot</option>

<option value="tibs">Tibs</option>

<option value="egg">Boiled Egg</option>

<option value="yogurt">Ergo / Plain Yogurt</option>

<option value="potato">Boiled Potato</option>

<option value="oats">Oats</option>

<option value="banana">Banana</option>

<option value="avocado">Avocado</option>

<option value="orange">Orange</option>

<option value="bread">Bread</option>

<option value="kinche">Kinche</option>

<option value="aja">Aja</option>

<option value="nuts">Mixed Nuts</option>

</select>


<label>Number of Servings</label>

<input
type="number"
id="foodServings"
value="1"
min="0.25"
step="0.25"
>


<button onclick="calculateFoodNutrition()">
Calculate Nutrition
</button>


<div id="foodResult" class="result"></div>

</div>


</div>


<footer>

Ethiopian Calorie & Fitness Planner

</footer>



<script>


// =====================================================
// BODY COMPOSITION
// =====================================================

function calculateBMI() {

    const weight =
        parseFloat(document.getElementById("weight").value);

    const height =
        parseFloat(document.getElementById("height").value);

    const result =
        document.getElementById("bmiResult");


    if (
        isNaN(weight) ||
        isNaN(height) ||
        weight <= 0 ||
        height <= 0
    ) {

        result.innerHTML =
            "Please enter a valid weight and height.";

        return;
    }


    const heightMeters = height / 100;

    const bmi =
        weight / (heightMeters * heightMeters);


    let category = "";


    if (bmi < 18.5) {

        category = "Underweight";

    } else if (bmi < 25) {

        category = "Normal weight";

    } else if (bmi < 30) {

        category = "Overweight";

    } else {

        category = "Obesity";

    }


    result.innerHTML = `

        <h3>BMI Result</h3>

        <p>
        <strong>BMI:</strong>
        ${bmi.toFixed(1)}
        </p>

        <p>
        <strong>Category:</strong>
        ${category}
        </p>

    `;

}



// =====================================================
// DAILY CALORIE REQUIREMENTS
// =====================================================

function createProgram() {

    const goal =
        document.getElementById("goal").value;

    const level =
        document.getElementById("level").value;

    const type =
        document.getElementById("type").value;

    const days =
        document.getElementById("days").value;

    const result =
        document.getElementById("programResult");


    if (!goal || !level || !type) {

        result.innerHTML =
            "Please select all training and goal options.";

        return;
    }


    let recommendation = "";


    if (goal === "weightloss") {

        recommendation =
            "Use a moderate calorie deficit while maintaining adequate protein and resistance training.";

    }

    else if (goal === "muscle") {

        recommendation =
            "Use a small calorie surplus with sufficient protein and progressive resistance training.";

    }

    else if (goal === "strength") {

        recommendation =
            "Prioritize adequate calories, protein, recovery and progressive strength training.";

    }

    else {

        recommendation =
            "Maintain energy balance and combine regular exercise with a balanced Ethiopian diet.";

    }


    result.innerHTML = `

        <h3>Daily Requirement Guidance</h3>

        <p>
        <strong>Goal:</strong>
        ${goal}
        </p>

        <p>
        <strong>Level:</strong>
        ${level}
        </p>

        <p>
        <strong>Training:</strong>
        ${type}
        </p>

        <p>
        <strong>Training Days:</strong>
        ${days} days/week
        </p>

        <p>
        ${recommendation}
        </p>

    `;

}



// =====================================================
// BASIC STRENGTH PROGRAMS
// =====================================================

function strengthDayA(goal) {

    return `

        <div class="exercise">
        Squat — 3 sets × 8–12 reps
        </div>

        <div class="exercise">
        Push-up / Bench Press — 3 sets × 8–12 reps
        </div>

        <div class="exercise">
        Row — 3 sets × 8–12 reps
        </div>

        <div class="exercise">
        Romanian Deadlift — 3 sets × 8–12 reps
        </div>

        <div class="exercise">
        Shoulder Press — 2 sets × 10–12 reps
        </div>

    `;

}


function strengthDayB(goal) {

    return `

        <div class="exercise">
        Deadlift — 3 sets × 5–8 reps
        </div>

        <div class="exercise">
        Split Squat — 3 sets × 8–12 reps
        </div>

        <div class="exercise">
        Pull-up / Lat Pulldown — 3 sets × 8–12 reps
        </div>

        <div class="exercise">
        Incline Press — 3 sets × 8–12 reps
        </div>

        <div class="exercise">
        Lateral Raise — 2 sets × 12–15 reps
        </div>

    `;

}



// =====================================================
// CORE
// =====================================================

function coreDay(day) {

    return `

        <div class="exercise">
        Plank — 3 × 30–60 seconds
        </div>

        <div class="exercise">
        Dead Bug — 3 × 10–15 reps
        </div>

        <div class="exercise">
        Bird Dog — 3 × 10–15 reps
        </div>

        <div class="exercise">
        Mountain Climber — 3 × 20 reps
        </div>

    `;

}



// =====================================================
// ADVANCED STRENGTH
// =====================================================

function advancedStrengthA(goal, level) {

    return `

        <h3>Upper Body + Lower Body A</h3>

        <div class="exercise">
        Squat — 3 × 6–10
        </div>

        <div class="exercise">
        Bench Press / Push-up — 3 × 6–12
        </div>

        <div class="exercise">
        Row — 3 × 8–12
        </div>

        <div class="exercise">
        Romanian Deadlift — 3 × 8–10
        </div>

        <div class="exercise">
        Shoulder Press — 2 × 8–12
        </div>

        <p>
        Focus: mechanical tension + progressive overload.
        </p>

    `;

}


function advancedStrengthB(goal, level) {

    return `

        <h3>Upper Body + Lower Body B</h3>

        <div class="exercise">
        Deadlift — 3 × 5–8
        </div>

        <div class="exercise">
        Split Squat — 3 × 8–12
        </div>

        <div class="exercise">
        Lat Pulldown / Pull-up — 3 × 8–12
        </div>

        <div class="exercise">
        Incline Press — 3 × 8–12
        </div>

        <div class="exercise">
        Lateral Raise — 2 × 12–15
        </div>

        <p>
        Focus: controlled technique + progressive overload.
        </p>

    `;

}



// =====================================================
// AEROBIC
// =====================================================

function advancedAerobic(day) {

    return `

        <h3>Aerobic Session ${day}</h3>

        <div class="exercise">
        Warm-up — 5–10 minutes
        </div>

        <div class="exercise">
        Moderate aerobic exercise — 25–35 minutes
        </div>

        <div class="exercise">
        Brisk walking / Jogging / Cycling / Soccer
        </div>

        <div class="exercise">
        Cool-down — 5–10 minutes
        </div>

    `;

}


function advancedAerobicShort(day) {

    return `

        <h3>Short Aerobic Session</h3>

        <div class="exercise">
        Warm-up — 5 minutes
        </div>

        <div class="exercise">
        Intervals — 15–20 minutes
        </div>

        <div class="exercise">
        Cool-down — 5 minutes
        </div>

    `;

}



// =====================================================
// ADVANCED CORE
// =====================================================

function advancedCore(day) {

    return `

        <h3>Core Session ${day}</h3>

        <div class="exercise">
        Plank — 3 × 30–60 sec
        </div>

        <div class="exercise">
        Side Plank — 3 × 20–45 sec each side
        </div>

        <div class="exercise">
        Dead Bug — 3 × 10–15
        </div>

        <div class="exercise">
        Bird Dog — 3 × 10–15
        </div>

        <div class="exercise">
        Mountain Climber — 3 × 20
        </div>

    `;

}


function advancedCoreShort(day) {

    return `

        <h3>Short Core Session</h3>

        <div class="exercise">
        Plank — 3 × 30 sec
        </div>

        <div class="exercise">
        Dead Bug — 3 × 10
        </div>

        <div class="exercise">
        Bird Dog — 3 × 10
        </div>

    `;

}



// =====================================================
// DAY NAME
// =====================================================

function getDayName(type, day) {

    if (type === "strength") {

        return "Strength Day " + day;

    }

    if (type === "aerobic") {

        return "Aerobic Day " + day;

    }

    if (type === "core") {

        return "Core Day " + day;

    }

    if (type === "strength-aerobic") {

        return "Strength + Aerobic Day " + day;

    }

    if (type === "strength-core") {

        return "Strength + Core Day " + day;

    }

    if (type === "aerobic-core") {

        return "Aerobic + Core Day " + day;

    }

    return "Training Day " + day;

}



// =====================================================
// ADVANCED TRAINING PROGRAM
// =====================================================

function createAdvancedProgram() {

    const goal =
        document.getElementById("trainingGoal").value;

    const level =
        document.getElementById("trainingLevel").value;

    const type =
        document.getElementById("trainingType").value;

    const days =
        parseInt(
            document.getElementById("trainingDays").value
        );

    const result =
        document.getElementById("advancedProgramResult");


    if (!goal || !level || !type || !days) {

        result.innerHTML =
            "Please select all training options.";

        return;
    }


    let html = `

        <h3>Your Training Program</h3>

        <p>
        <strong>Goal:</strong> ${goal}
        </p>

        <p>
        <strong>Level:</strong> ${level}
        </p>

        <p>
        <strong>Training Type:</strong> ${type}
        </p>

        <p>
        <strong>Training Days:</strong> ${days}
        </p>

    `;


    for (let day = 1; day <= days; day++) {

        html += `<hr>`;

        html += `<h3>${getDayName(type, day)}</h3>`;


        if (type === "strength") {

            if (day % 2 === 1) {

                html += advancedStrengthA(goal, level);

            } else {

                html += advancedStrengthB(goal, level);

            }

        }


        else if (type === "aerobic") {

            html += advancedAerobic(day);

        }


        else if (type === "core") {

            html += advancedCore(day);

        }


        else if (type === "strength-aerobic") {

            if (day % 2 === 1) {

                html += advancedStrengthA(goal, level);

            } else {

                html += advancedAerobicShort(day);

            }

        }


        else if (type === "strength-core") {

            if (day % 2 === 1) {

                html += advancedStrengthA(goal, level);

            } else {

                html += advancedCoreShort(day);

            }

        }


        else if (type === "aerobic-core") {

            html += advancedAerobicShort(day);

            html += advancedCoreShort(day);

        }

    }


    html += `

        <div class="warning">

        <strong>Training principles:</strong><br>

        Use good technique, progressive overload and
        appropriate resistance. Most working sets should
        finish close to muscular failure while maintaining
        proper form. Allow adequate recovery between sessions.

        </div>

    `;


    result.innerHTML = html;

}



// =====================================================
// ETHIOPIAN FOOD NUTRITION DATABASE
// =====================================================

function calculateFoodNutrition() {

    const food =
        document.getElementById("foodSelect").value;

    const servings =
        parseFloat(
            document.getElementById("foodServings").value
        );

    const result =
        document.getElementById("foodResult");


    const foods = {

        injera: {
            name: "Injera",
            serving: "1 medium piece (~100 g)",
            calories: 170,
            protein: 5,
            carbs: 35,
            fat: 1
        },

        misir: {
            name: "Misir Wot",
            serving: "1 cup (~200 g)",
            calories: 280,
            protein: 14,
            carbs: 40,
            fat: 7
        },

        shiro: {
            name: "Shiro Wot",
            serving: "1 cup (~200 g)",
            calories: 300,
            protein: 12,
            carbs: 35,
            fat: 12
        },

        tibs: {
            name: "Tibs",
            serving: "100 g",
            calories: 250,
            protein: 25,
            carbs: 5,
            fat: 14
        },

        egg: {
            name: "Boiled Egg",
            serving: "1 large egg (~50 g)",
            calories: 72,
            protein: 6.3,
            carbs: 0.4,
            fat: 4.8
        },

        yogurt: {
            name: "Ergo / Plain Yogurt",
            serving: "1 cup (~240 g)",
            calories: 140,
            protein: 8,
            carbs: 11,
            fat: 7
        },

        potato: {
            name: "Boiled Potato",
            serving: "1 medium (~150 g)",
            calories: 130,
            protein: 3,
            carbs: 30,
            fat: 0.2
        },

        oats: {
            name: "Oats",
            serving: "1/2 cup (~40 g)",
            calories: 150,
            protein: 5,
            carbs: 27,
            fat: 3
        },

        banana: {
            name: "Banana",
            serving: "1 medium banana",
            calories: 105,
            protein: 1.3,
            carbs: 27,
            fat: 0.4
        },

        avocado: {
            name: "Avocado",
            serving: "1/2 medium avocado",
            calories: 160,
            protein: 2,
            carbs: 9,
            fat: 15
        },

        orange: {
            name: "Orange",
            serving: "1 medium orange",
            calories: 62,
            protein: 1.2,
            carbs: 15,
            fat: 0.2
        },

        bread: {
            name: "Bread",
            serving: "1 slice",
            calories: 80,
            protein: 3,
            carbs: 15,
            fat: 1
        },

        kinche: {
            name: "Kinche",
            serving: "1 cup",
            calories: 180,
            protein: 5,
            carbs: 32,
            fat: 4
        },

        aja: {
            name: "Aja",
            serving: "1 cup",
            calories: 180,
            protein: 5,
            carbs: 32,
            fat: 4
        },

        nuts: {
            name: "Mixed Nuts",
            serving: "30 g",
            calories: 170,
            protein: 5,
            carbs: 6,
            fat: 15
        }

    };


    if (
        !food ||
        isNaN(servings) ||
        servings <= 0
    ) {

        result.innerHTML =
            "Please select a food and enter a valid number of servings.";

        return;
    }


    const f = foods[food];


    if (!f) {

        result.innerHTML =
            "Food information not found.";

        return;
    }


    const calories =
        f.calories * servings;

    const protein =
        f.protein * servings;

    const carbs =
        f.carbs * servings;

    const fat =
        f.fat * servings;


    result.innerHTML = `

        <h3>${f.name}</h3>

        <p>
        <strong>Serving:</strong>
        ${f.serving}
        </p>

        <p>
        <strong>Servings:</strong>
        ${servings}
        </p>

        <p>
        <strong>Calories:</strong>
        ${calories.toFixed(0)} kcal
        </p>

        <p>
        <strong>Protein:</strong>
        ${protein.toFixed(1)} g
        </p>

        <p>
        <strong>Carbohydrates:</strong>
        ${carbs.toFixed(1)} g
        </p>

        <p>
        <strong>Fat:</strong>
        ${fat.toFixed(1)} g
        </p>

    `;

}

</script>

</body>
</html>
