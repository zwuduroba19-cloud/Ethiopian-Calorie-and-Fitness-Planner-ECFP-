<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECFP - Ethiopian Calorie & Fitness Planner</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f6f8;
color:#222;
}
header{
background:#176b3a;
color:white;
padding:20px;
text-align:center;
}
.container{
max-width:1000px;
margin:auto;
padding:15px;
}
.card{
background:white;
padding:20px;
margin:15px 0;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}
h2{color:#176b3a;}
label{
display:block;
font-weight:bold;
margin-top:10px;
}
input,select{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:7px;
box-sizing:border-box;
}
button{
background:#176b3a;
color:white;
border:none;
padding:12px 18px;
border-radius:7px;
margin-top:15px;
font-weight:bold;
cursor:pointer;
}
button:hover{opacity:.9;}
.result{
background:#eef8f1;
padding:15px;
border-radius:8px;
margin-top:15px;
}
table{
width:100%;
border-collapse:collapse;
margin-top:12px;
}
th,td{
border:1px solid #ddd;
padding:8px;
text-align:left;
font-size:14px;
}
th{
background:#176b3a;
color:white;
}
.tip{
background:#fff8df;
padding:12px;
border-left:5px solid #d8a600;
margin-top:10px;
border-radius:5px;
}
.exercise{
background:#f7f7f7;
padding:12px;
margin:8px 0;
border-radius:8px;
}
.small{
font-size:13px;
color:#555;
}
</style>
</head>

<body>

<header>
<h1>ECFP</h1>
<p>Ethiopian Calorie & Fitness Planner</p>
</header>
