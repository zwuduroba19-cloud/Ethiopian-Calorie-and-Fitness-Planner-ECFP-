<script>

function calculateBMI() {

    let weight = parseFloat(document.getElementById("weight").value);
    let height = parseFloat(document.getElementById("height").value);

    if (!weight || !height) {
        document.getElementById("bmiResult").innerHTML =
        "Please enter your weight and height.";
        return;
    }

    let heightM = height / 100;
    let bmi = weight / (heightM * heightM);

    let classification;

    if (bmi < 18.5) {
        classification = "Underweight";
    } else if (bmi < 25) {
        classification = "Normal weight";
    } else if (bmi < 30) {
        classification = "Overweight";
    } else {
        classification = "Obesity";
    }

    document.getElementById("bmiResult").innerHTML =
        "<strong>BMI:</strong> " + bmi.toFixed(1) +
        "<br><strong>Classification:</strong> " + classification;
}

function buildStrengthProgram(days) {

    let plans = [];

    for (let i = 0; i < days; i++) {

        if (i % 2 === 0) {

            plans.push({
                name: "Full Body A",
                exercises: strengthA,
                rest: "Rest/recovery: 60–120 seconds between strength sets."
            });

        } else {

            plans.push({
                name: "Full Body B",
                exercises: strengthB,
                rest: "Rest/recovery: 60–120 seconds between strength sets."
            });
        }
    }

    return plans;
}


/* =====================================================
   AEROBIC PROGRAM
   ===================================================== */

function buildAerobicProgram(days) {

    let plans = [];

    for (let i = 0; i < days; i++) {

        if (i % 2 === 0) {

            plans.push({
                name: "Aerobic Endurance A",
                exercises: aerobicA,
                rest: "Maintain a controlled intensity and recover adequately."
            });

        } else {

            plans.push({
                name: "Aerobic Endurance B",
                exercises: aerobicB,
                rest: "Maintain appropriate intensity and hydration."
            });
        }
    }

    return plans;
}


/* =====================================================
   CORE PROGRAM
   ===================================================== */

function buildCoreProgram(days) {

    let plans = [];

    for (let i = 0; i < days; i++) {

        if (i % 2 === 0) {

            plans.push({
                name: "Core Stability A",
                exercises: coreA,
                rest: "Rest 30–60 seconds between core exercises."
            });

        } else {

            plans.push({
                name: "Core Stability B",
                exercises: coreB,

            });
        }
    }

    return plans;
}

    let plans = [];

                    ["Plank", "3", "30–60 sec"],
                    ["Dead Bug", "2", "10–15 each side"],
                    ["Bird Dog", "2", "10–15 each side"]
                ],
                rest: "Maintain moderate aerobic intensity and controlled core movements."
            });

        } else {

            plans.push({
                name: "Aerobic + Core B",
                exercises: [
                    ["Jogging / Football", "1", "20–45 min"],
                    ["Side Plank", "2", "20–45 sec each side"],
                    ["Reverse Crunch", "3", "10–15"],
                    ["Mountain Climber", "3", "20–30 sec"]
                ],
                rest: "Recover adequately between aerobic and core activities."
            });
        }
    }

    return plans;
}


/* =====================================================
   TEXT FORMATTER
   ===================================================== */

function formatText(text) {

    if (!text) return "";

    return text
        .replaceAll("_", " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());
}
