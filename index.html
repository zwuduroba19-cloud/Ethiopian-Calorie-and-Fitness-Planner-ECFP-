<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECFP - Ethiopian Calorie & Fitness Planner</title><style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f6f8;
color:#222;
}
header{
background:#1f4d3a;
color:white;
padding:20px;
text-align:center;
}
.container{
max-width:900px;
margin:auto;
padding:20px;
}
.card{
background:white;
padding:20px;
margin:15px 0;
border-radius:12px;
box-shadow:0 2px 8px #0002;
}
h2{color:#1f4d3a;}
label{
display:block;
font-weight:bold;
margin-top:12px;
}
input,select{
width:100%;
padding:11px;
margin-top:5px;
border:1px solid #ccc;
border-radius:7px;
box-sizing:border-box;
}
button{
background:#1f4d3a;
color:white;
border:none;
padding:12px 18px;
border-radius:7px;
margin-top:18px;
font-weight:bold;
cursor:pointer;
}
.result{
margin-top:15px;
padding:15px;
background:#eef6f1;
border-radius:8px;
}
.exercise{
padding:12px;
margin:8px 0;
background:#f5f5f5;
border-left:5px solid #1f4d3a;
border-radius:6px;
}
</style></head><body><header>
<h1>ECFP</h1>
<p>Ethiopian Calorie & Fitness Planner</p>
</header><div class="container"><div class="card">
<h2>1. Body Composition</h2><label>Weight (kg)</label>
<input id="weight" type="number">

<label>Height (cm)</label>
<input id="height" type="number">

<label>Age</label>
<input id="age" type="number">

<label>Sex</label>
<select id="sex">

<option value="male">Male</option>
<option value="female">Female</option>
</select><button onclick="calculateBMI()">Calculate</button>

<div id="bmiResult" class="result"></div>
</div><div class="card">
<h2>2. Daily Calorie Requirements</h2><label>Activity Level</label>
<select id="activity">

<option value="1.2">Sedentary – little exercise</option>
<option value="1.375">Light – 1–3 days/week</option>
<option value="1.55">Moderate – 3–5 days/week</option>
<option value="1.725">High – 6–7 days/week</option>
<option value="1.9">Very High – hard training/athlete</option>
</select><button onclick="calculateCalories()">Calculate Daily Calories</button>

<div id="calorieResult" class="result"></div>
</div><div class="card">
<h2>3. Training Program Planner</h2><label>Training Goal</label>
<select id="goal">

<option value="strength">Strength</option>
<option value="muscle">Muscle Building</option>
<option value="fatloss">Fat Loss</option>
<option value="fitness">General Fitness</option>
<option value="performance">Sports Performance</option>
</select><label>Current Level</label>
<select id="level">

<option value="beginner">Beginner</option>
<option value="intermediate">Intermediate</option>
<option value="advanced">Advanced</option>
</select><label>Primary Training Type</label>
<select id="type">

<option value="strength">Strength</option>
<option value="aerobic">Aerobic</option>
<option value="core">Core</option>
<option value="mobility">Mobility</option>
</select><label>Secondary Training Type</label>
<select id="secondary">

<option value="none">None</option>
<option value="strength">Strength</option>
<option value="aerobic">Aerobic</option>
<option value="core">Core</option>
<option value="mobility">Mobility</option>
</select><label>Training Days per Week</label>
<select id="days">

<option value="2">2 days</option>
<option value="3">3 days</option>
<option value="4">4 days</option>
<option value="5">5 days</option>
<option value="6">6 days</option>
</select><button onclick="generateProgram()">Generate Training Program</button>

<div id="programResult" class="result"></div>
</div></div><script>

function calculateBMI(){

let w=parseFloat(document.getElementById("weight").value);
let h=parseFloat(document.getElementById("height").value);

if(!w || !h){
document.getElementById("bmiResult").innerHTML=
"Please enter weight and height.";
return;
}

let bmi=w/Math.pow(h/100,2);
let category="";

if(bmi<18.5) category="Underweight";
else if(bmi<25) category="Normal weight";
else if(bmi<30) category="Overweight";
else category="Obesity";

document.getElementById("bmiResult").innerHTML=
"<b>BMI:</b> "+bmi.toFixed(1)+
"<br><b>Classification:</b> "+category;
}


function calculateCalories(){

let w=parseFloat(document.getElementById("weight").value);
let h=parseFloat(document.getElementById("height").value);
let age=parseFloat(document.getElementById("age").value);
let sex=document.getElementById("sex").value;
let activity=parseFloat(document.getElementById("activity").value);

if(!w || !h || !age){
document.getElementById("calorieResult").innerHTML=
"Please enter weight, height and age first.";
return;
}

let bmr;

if(sex==="male"){
bmr=(10*w)+(6.25*h)-(5*age)+5;
}else{
bmr=(10*w)+(6.25*h)-(5*age)-161;
}

let calories=bmr*activity;

document.getElementById("calorieResult").innerHTML=
"<b>BMR:</b> "+Math.round(bmr)+
" kcal/day<br><b>Estimated daily requirement:</b> "+
Math.round(calories)+" kcal/day";
}


function generateProgram(){

let goal=document.getElementById("goal").value;
let level=document.getElementById("level").value;
let type=document.getElementById("type").value;
let secondary=document.getElementById("secondary").value;
let days=parseInt(document.getElementById("days").value);

let exercises=[];
let sets=2;
let reps="8–12";
let intensity="RPE 6–8";
let rest="60–120 seconds";

if(level==="beginner"){
sets=2;
intensity="RPE 6–7";
rest="60–90 seconds";
}

if(level==="intermediate"){
sets=3;
intensity="RPE 7–8";
rest="90–120 seconds";
}

if(level==="advanced"){
sets=3;
intensity="RPE 8–9";
rest="120–180 seconds";
}

if(goal==="strength"){
reps="4–8";
}

if(goal==="fatloss"){
reps="8–15";
}

if(goal==="muscle"){
reps="8–12";
}


if(type==="strength"){

exercises=[
"Squat – "+sets+" sets × "+reps,
"Push-up / Bench Press – "+sets+" sets × "+reps,
"Row – "+sets+" sets × "+reps,
"Romanian Deadlift – "+sets+" sets × "+reps,
"Overhead Press – "+sets+" sets × "+reps
];

}


if(type==="aerobic"){

exercises=[
"Brisk Walking – 20–30 minutes",
"Jogging – 15–25 minutes",
"Cycling – 20–30 minutes",
"Football / Soccer – 30–60 minutes"
];

}


if(type==="core"){

exercises=[
"Plank – 2–3 × 20–45 sec",
"Dead Bug – 2–3 × 8–12",
"Bird Dog – 2–3 × 8–12",
"Side Plank – 2–3 × 20–40 sec"
];

}


if(type==="mobility"){

exercises=[
"Shoulder Mobility – 2 × 10",
"Hip Mobility – 2 × 10",
"Thoracic Rotation – 2 × 10",
"Ankle Mobility – 2 × 10"
];

}


if(secondary!=="none"){

if(secondary==="core"){
exercises.push(
"Core: Plank – 2 × 20–45 sec",
"Core: Dead Bug – 2 × 8–12"
);
}

if(secondary==="aerobic"){
exercises.push(
"Aerobic: Brisk Walking/Jogging – 15–30 min"
);
}

if(secondary==="strength"){
exercises.push(
"Strength: Squat – 2 × 8–12",
"Strength: Push-up – 2 × 8–12",
"Strength: Row – 2 × 8–12"
);
}

if(secondary==="mobility"){
exercises.push(
"Mobility: Hip + Shoulder mobility – 5–10 min"
);
}

}


let schedule="";

for(let i=1;i<=days;i++){

let dayExercise=exercises[(i-1)%exercises.length];

schedule+=
"<div class='exercise'><b>Day "+i+
"</b><br>"+dayExercise+"</div>";
}


document.getElementById("programResult").innerHTML=

"<b>Goal:</b> "+goal+
"<br><b>Level:</b> "+level+
"<br><b>Training combination:</b> "+type+
(secondary!=="none" ? " + "+secondary : "")+
"<br><b>Intensity:</b> "+intensity+
"<br><b>Rest:</b> "+rest+
"<br><br><b>Weekly Program:</b>"+
schedule+
"<br><b>Progressive Overload:</b> When all prescribed reps are completed with good technique, gradually increase resistance, repetitions, or training difficulty."+
"<br><br><b>Warm-up:</b> 5–10 minutes"+
"<br><b>Cool-down:</b> 5–10 minutes";

}

</script></body>
</html>
