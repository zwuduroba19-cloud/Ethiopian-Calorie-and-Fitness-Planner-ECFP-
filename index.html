<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ethiopian Calorie & Fitness Planner</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f7f5;
    color: #222;
}

header {
    background: #176b3a;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

h2 {
    color: #176b3a;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

select, input, button {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    box-sizing: border-box;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    background: #176b3a;
    color: white;
    border: none;
    font-weight: bold;
    margin-top: 18px;
}

button:hover {
    background: #0f4d29;
}

.result {
    background: #eef7f0;
    padding: 15px;
    margin-top: 15px;
    border-radius: 8px;
}
</style>
</head>

<body>

<header>
    <h1>Ethiopian Calorie & Fitness Planner</h1>
    <p>Body Composition • Calories • Training Program</p>
</header>

<div class="container">

<div class="card">
    <h2>Body Composition</h2>

    <label>Weight (kg)</label>
    <input type="number" id="weight" placeholder="Enter weight">

    <label>Height (cm)</label>
    <input type="number" id="height" placeholder="Enter height">

    <button onclick="calculateBMI()">Calculate BMI</button>

    <div id="bmiResult" class="result"></div>
</div>

<div class="card">
    <h2>Daily Calorie Requirements</h2>

    <label>Training Goal</label>
    <select id="goal">
        <option value="fatloss">Fat Loss</option>
        <option value="muscle">Muscle Building</option>
        <option value="fitness">General Fitness</option>
        <option value="strength">Strength</option>
    </select>

    <label>Current Level</label>
    <select id="level">
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Advanced</option>
    </select>

    <label>Training Type</label>
    <select id="type">
        <option>Strength</option>
        <option>Aerobic</option>
        <option>Strength + Aerobic</option>
        <option>Core + Strength</option>
    </select>

    <label>Training Days Per Week</label>
    <select id="days">
        <option value="2">2 days</option>
        <option value="3">3 days</option>
        <option value="4">4 days</option>
        <option value="5">5 days</option>
        <option value="6">6 days</option>
    </select>

    <button onclick="createProgram()">Create Training Program</button>

    <div id="programResult" class="result"></div>
</div>

</div>

<script>

function calculateBMI() {

    let weight = parseFloat(document.getElementById("weight").value);
    let height = parseFloat(document.getElementById("height").value);

    if (!weight || !height) {
        document.getElementById("bmiResult").innerHTML =
        "Please enter your weight and height.";
        return;
    }

    let heightM = height / 100;
    let bmi = weight / (heightM * heightM);

    let classification = "";

    if (bmi < 18.5) {
        classification = "Underweight";
    } else if (bmi < 25) {
        classification = "Normal weight";
    } else if (bmi < 30) {
        classification = "Overweight";
    } else {
        classification = "Obesity";
    }

    document.getElementById("bmiResult").innerHTML =
    "<strong>BMI:</strong> " + bmi.toFixed(1) +
    "<br><strong>Classification:</strong> " + classification;
}


function createProgram() {

    let goal = document.getElementById("goal").value;
    let level = document.getElementById("level").value;
    let type = document.getElementById("type").value;
    let days = document.getElementById("days").value;

    let exercises = `
        <h3>Your Training Program</h3>

        <p><strong>Goal:</strong> ${goal}</p>
        <p><strong>Level:</strong> ${level}</p>
        <p><strong>Training Type:</strong> ${type}</p>
        <p><strong>Training Days:</strong> ${days} days/week</p>

        <hr>

        <p><strong>Squat:</strong> 3 sets × 8–12 reps</p>
        <p><strong>Push-up:</strong> 3 sets × 8–15 reps</p>
        <p><strong>Row:</strong> 3 sets × 8–12 reps</p>
        <p><strong>Core:</strong> 3 sets × 10–15 reps</p>

        <p><strong>Progressive Overload:</strong>
        Gradually increase resistance, repetitions, or training quality as your fitness improves.</p>
    `;

    document.getElementById("programResult").innerHTML = exercises;
}

</script>

</body>
</html>
