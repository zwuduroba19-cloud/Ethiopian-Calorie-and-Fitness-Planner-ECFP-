<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ethiopian Calorie & Fitness Planner</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f7f5;
    color: #222;
}

header {
    background: #176b3a;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

h2 {
    color: #176b3a;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

input, select, button {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    box-sizing: border-box;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    background: #176b3a;
    color: white;
    border: none;
    font-weight: bold;
    margin-top: 18px;
}

.result {
    background: #eef7f0;
    padding: 15px;
    margin-top: 15px;
    border-radius: 8px;
}

.exercise {
    background: white;
    padding: 12px;
    margin: 10px 0;
    border-left: 4px solid #176b3a;
    border-radius: 6px;
}
</style>
</head>

<body>

<header>
    <h1>Ethiopian Calorie & Fitness Planner</h1>
    <p>Body Composition • Calories • Training Program</p>
</header>

<div class="container">

<!-- BODY COMPOSITION -->

<div class="card">
    <h2>Body Composition</h2>

    <label>Weight (kg)</label>
    <input type="number" id="weight" placeholder="Enter weight">

    <label>Height (cm)</label>
    <input type="number" id="height" placeholder="Enter height">

    <button onclick="calculateBMI()">Calculate BMI</button>

    <div id="bmiResult" class="result"></div>
</div>


<!-- DAILY REQUIREMENTS -->

<div class="card">
    <h2>Daily Calorie Requirements</h2>

    <label>Training Goal</label>
    <select id="goal">
        <option value="fatloss">Fat Loss</option>
        <option value="muscle">Muscle Building</option>
        <option value="fitness">General Fitness</option>
        <option value="strength">Strength</option>
    </select>

    <label>Current Level</label>
    <select id="level">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
    </select>

    <label>Training Type</label>
    <select id="type">
        <option value="strength">Strength</option>
        <option value="aerobic">Aerobic</option>
        <option value="strength_aerobic">Strength + Aerobic</option>
        <option value="strength_core">Strength + Core</option>
        <option value="aerobic_core">Aerobic + Core</option>
        <option value="strength_aerobic_core">Strength + Aerobic + Core</option>
    </select>

    <label>Training Days Per Week</label>
    <select id="days">
        <option value="2">2 days</option>
        <option value="3">3 days</option>
        <option value="4">4 days</option>
        <option value="5">5 days</option>
        <option value="6">6 days</option>
    </select>

    <button onclick="createProgram()">Create Training Program</button>

    <div id="programResult" class="result"></div>
</div>

</div>


<script>

function calculateBMI() {

    let weight = parseFloat(document.getElementById("weight").value);
    let height = parseFloat(document.getElementById("height").value);

    if (!weight || !height) {
        document.getElementById("bmiResult").innerHTML =
        "Please enter your weight and height.";
        return;
    }

    let heightM = height / 100;
    let bmi = weight / (heightM * heightM);

    let classification;

    if (bmi < 18.5) {
        classification = "Underweight";
    } else if (bmi < 25) {
        classification = "Normal weight";
    } else if (bmi < 30) {
        classification = "Overweight";
    } else {
        classification = "Obesity";
    }

    document.getElementById("bmiResult").innerHTML =
        "<strong>BMI:</strong> " + bmi.toFixed(1) +
        "<br><strong>Classification:</strong> " + classification;
}


function createProgram() {

    let goal = document.getElementById("goal").value;
    let level = document.getElementById("level").value;
    let type = document.getElementById("type").value;
    let days = parseInt(document.getElementById("days").value);

    let goalText = {
        fatloss: "Fat Loss",
        muscle: "Muscle Building",
        fitness: "General Fitness",
        strength: "Strength"
    };

    let levelText = {
        beginner: "Beginner",
        intermediate: "Intermediate",
        advanced: "Advanced"
    };

    let typeText = {
        strength: "Strength",
        aerobic: "Aerobic",
        strength_aerobic: "Strength + Aerobic",
        strength_core: "Strength + Core",
        aerobic_core: "Aerobic + Core",
        strength_aerobic_core: "Strength + Aerobic + Core"
    };

    let exercises = `
        <h3>Your Training Program</h3>

        <p><strong>Goal:</strong> ${goalText[goal]}</p>
        <p><strong>Level:</strong> ${levelText[level]}</p>
        <p><strong>Training Type:</strong> ${typeText[type]}</p>
        <p><strong>Training Days:</strong> ${days} days/week</p>

        <hr>
    `;


    /* STRENGTH */

    if (
        type === "strength" ||
        type === "strength_aerobic" ||
        type === "strength_core" ||
        type === "strength_aerobic_core"
    ) {

        exercises += `
            <h3>Strength Training</h3>

            <div class="exercise">
                <strong>Squat</strong><br>
                3 sets × 8–12 reps
            </div>

            <div class="exercise">
                <strong>Push-up</strong><br>
                3 sets × 8–15 reps
            </div>

            <div class="exercise">
                <strong>Row</strong><br>
                3 sets × 8–12 reps
            </div>
        `;
    }


    /* AEROBIC */

    if (
        type === "aerobic" ||
        type === "strength_aerobic" ||
        type === "aerobic_core" ||
        type === "strength_aerobic_core"
    ) {

        exercises += `
            <h3>Aerobic Training</h3>

            <div class="exercise">
                <strong>Brisk Walking</strong><br>
                20–30 minutes
            </div>

            <div class="exercise">
                <strong>Jogging / Running</strong><br>
                15–25 minutes
            </div>

            <div class="exercise">
                <strong>Cycling or Football</strong><br>
                20–30 minutes
            </div>
        `;
    }


    /* CORE */

    if (
        type === "strength_core" ||
        type === "aerobic_core" ||
        type === "strength_aerobic_core"
    ) {

        exercises += `
            <h3>Core Training</h3>

            <div class="exercise">
                <strong>Plank</strong><br>
                3 sets × 30–60 seconds
            </div>

            <div class="exercise">
                <strong>Dead Bug</strong><br>
                3 sets × 8–12 reps per side
            </div>

            <div class="exercise">
                <strong>Bird Dog</strong><br>
                3 sets × 8–12 reps per side
            </div>
        `;
    }


    /* TRAINING PRINCIPLES */

function createProgram() {

    let goal = document.getElementById("goal").value;
    let level = document.getElementById("level").value;
    let type = document.getElementById("type").value;
    let days = parseInt(document.getElementById("days").value);

    let goalText = {
        fatloss: "Fat Loss",
        muscle: "Muscle Building",
        fitness: "General Fitness",
        strength: "Strength"
    };

    let levelText = {
        beginner: "Beginner",
        intermediate: "Intermediate",
        advanced: "Advanced"
    };

    let typeText = {
        strength: "Strength",
        aerobic: "Aerobic",
        strength_aerobic: "Strength + Aerobic",
        strength_core: "Strength + Core"
    };

    let program = `
        <h3>Your Weekly Training Program</h3>

        <p><strong>Goal:</strong> ${goalText[goal]}</p>
        <p><strong>Level:</strong> ${levelText[level]}</p>
        <p><strong>Training Type:</strong> ${typeText[type]}</p>
        <p><strong>Training Days:</strong> ${days} days/week</p>
        <hr>
    `;

    for (let day = 1; day <= days; day++) {

        program += `<h3>Day ${day}</h3>`;

        /* STRENGTH */

        if (
            type === "strength" ||
            type === "strength_aerobic" ||
            type === "strength_core"
        ) {

            if (day % 2 === 1) {

                program += `
                    <div class="exercise">
                        <strong>Squat</strong><br>
                        3 sets × 8–12 reps
                    </div>

                    <div class="exercise">
                        <strong>Push-up</strong><br>
                        3 sets × 8–15 reps
                    </div>

                    <div class="exercise">
                        <strong>Row</strong><br>
                        3 sets × 8–12 reps
                    </div>
                `;

            } else {

                program += `
                    <div class="exercise">
                        <strong>Lunge</strong><br>
                        3 sets × 8–12 reps per leg
                    </div>

                    <div class="exercise">
                        <strong>Shoulder Press</strong><br>
                        3 sets × 8–12 reps
                    </div>

                    <div class="exercise">
                        <strong>Hip Hinge / Deadlift</strong><br>
                        3 sets × 8–12 reps
                    </div>
                `;
            }
        }

        /* CORE */

        if (type === "strength_core") {

            program += `
                <div class="exercise">
                    <strong>Plank</strong><br>
                    3 sets × 30–60 seconds
                </div>

                <div class="exercise">
                    <strong>Dead Bug</strong><br>
                    3 sets × 8–12 reps per side
                </div>
            `;
        }

        /* AEROBIC */

        if (type === "aerobic") {

            program += `
                <div class="exercise">
                    <strong>Brisk Walking</strong><br>
                    25–40 minutes
                </div>

                <div class="exercise">
                    <strong>Jogging / Running</strong><br>
                    20–30 minutes
                </div>
            `;
        }

        /* STRENGTH + AEROBIC */

        if (type === "strength_aerobic") {

            program += `
                <div class="exercise">
                    <strong>Aerobic Conditioning</strong><br>
                    Brisk walking, jogging, cycling or football — 20–30 minutes
                </div>
            `;
        }
    }

    program += `
        <hr>

        <h3>Training Principles</h3>

        <p>
        <strong>Mechanical Tension:</strong>
        Use appropriate resistance and controlled movement.
        </p>

        <p>
        <strong>Progressive Overload:</strong>
        Gradually increase resistance, repetitions, quality or duration.
        </p>

        <p>
        <strong>Recovery:</strong>
        Allow adequate recovery between training sessions.
        </p>
    `;

    document.getElementById("programResult").innerHTML = program;
}

</script>

</body>
</html>
